<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MOTI — AI</title>
  <link rel="stylesheet" href="/static/css/display.css"/>
</head>
<body>

<!-- Screen corner brackets -->
<span class="scr-corner tl"></span>
<span class="scr-corner tr"></span>
<span class="scr-corner bl"></span>
<span class="scr-corner br"></span>

<!-- ══ TOP BAR ═══════════════════════════════════════════════════════════ -->
<header class="topbar">
  <div class="tb-logo">
    <svg viewBox="0 0 34 34" class="logo-svg">
      <circle cx="17" cy="17" r="14" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.25"/>
      <circle cx="17" cy="17" r="9"  fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
      <circle cx="17" cy="17" r="4"  fill="#00d4ff"/>
      <circle cx="17" cy="17" r="1.5" fill="#ffffff"/>
    </svg>
    <div class="logo-text">
      <div class="logo-name">MOTI</div>
      <div class="logo-sub">ROOM INTELLIGENCE · OS v2</div>
    </div>
  </div>

  <div class="tb-clock">
    <div class="tb-time" id="d-clock">00:00:00</div>
    <div class="tb-date" id="d-date">—</div>
  </div>

  <div class="tb-right">
    <div class="pill" id="pill-lights"><span class="pill-dot"></span>LIGHTS</div>
    <div class="pill" id="pill-spotify"><span class="pill-dot"></span>SPOTIFY</div>
    <a href="/" class="ctrl-link">⚙ CTRL</a>
  </div>
</header>

<!-- ══ WIDGET CANVAS ═══════════════════════════════════════════════════════ -->
<div class="canvas" id="canvas">

  <!-- LIGHTS widget -->
  <div class="widget" data-wid="lights">
    <div class="widget-bar">
      <span class="wi-dot"></span>
      <span class="wi-title">LIGHTING</span>
      <span class="wi-drag">⠿</span>
    </div>
    <div class="widget-body" id="d-lights">
      <div class="empty-msg">No lights configured</div>
    </div>
  </div>

  <!-- SPOTIFY widget -->
  <div class="widget" data-wid="spotify">
    <div class="widget-bar">
      <span class="wi-dot"></span>
      <span class="wi-title">AUDIO STREAM</span>
      <span class="wi-drag">⠿</span>
    </div>
    <div class="widget-body sp-body">
      <div class="sp-row">
        <!-- Album art + circular progress -->
        <div class="sp-art-wrap">
          <svg viewBox="0 0 120 120" class="sp-ring-svg">
            <circle cx="60" cy="60" r="54" fill="none" stroke="#0d1e38" stroke-width="3"/>
            <circle id="sp-ring" cx="60" cy="60" r="54" fill="none"
                    stroke="#00d4ff" stroke-width="3" stroke-linecap="round"
                    stroke-dasharray="339.3 339.3" stroke-dashoffset="339.3"
                    transform="rotate(-90 60 60)"
                    style="transition:stroke-dashoffset 0.5s linear"/>
          </svg>
          <div class="sp-art" id="d-album-art">♪</div>
        </div>
        <!-- Track info -->
        <div class="sp-info">
          <div class="sp-track"  id="d-track">Nothing playing</div>
          <div class="sp-artist" id="d-artist">—</div>
          <div class="sp-times">
            <span id="d-prog-cur"   class="sp-t">0:00</span>
            <span id="d-prog-total" class="sp-t">0:00</span>
          </div>
          <div class="vol-row">
            <span class="vol-lbl">VOL</span>
            <div class="vol-bar"><div class="vol-fill" id="d-vol-fill"></div></div>
            <span class="vol-val" id="d-vol-pct">—</span>
          </div>
        </div>
      </div>
      <!-- EQ bars -->
      <div class="eq-row" id="eq-bars">
        <span class="eqb"></span><span class="eqb"></span><span class="eqb"></span>
        <span class="eqb"></span><span class="eqb"></span><span class="eqb"></span>
        <span class="eqb"></span><span class="eqb"></span><span class="eqb"></span>
        <span class="eqb"></span><span class="eqb"></span><span class="eqb"></span>
      </div>
    </div>
  </div>

  <!-- PC STATS widget -->
  <div class="widget" data-wid="pc">
    <div class="widget-bar">
      <span class="wi-dot"></span>
      <span class="wi-title">SYSTEM RESOURCES</span>
      <span class="wi-drag">⠿</span>
    </div>
    <div class="widget-body pc-body">
      <div class="gauges-row">
        <div class="gauge-wrap">
          <svg viewBox="0 0 70 70" class="gauge-svg">
            <circle cx="35" cy="35" r="28" fill="none" stroke="#0d1e38" stroke-width="4"/>
            <circle id="arc-cpu" cx="35" cy="35" r="28" fill="none" stroke="#00d4ff"
                    stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="175.9 175.9" stroke-dashoffset="175.9"
                    transform="rotate(-90 35 35)"
                    style="transition:stroke-dashoffset 0.6s;filter:drop-shadow(0 0 5px #00d4ff)"/>
            <text id="gauge-cpu-val" x="35" y="32" text-anchor="middle"
                  fill="#00d4ff" font-size="11" font-weight="700" font-family="'Share Tech Mono',monospace">0%</text>
            <text x="35" y="44" text-anchor="middle"
                  fill="#2e4a6a" font-size="6" font-family="'Share Tech Mono',monospace">CPU</text>
          </svg>
        </div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 70 70" class="gauge-svg">
            <circle cx="35" cy="35" r="28" fill="none" stroke="#0d1e38" stroke-width="4"/>
            <circle id="arc-ram" cx="35" cy="35" r="28" fill="none" stroke="#7b61ff"
                    stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="175.9 175.9" stroke-dashoffset="175.9"
                    transform="rotate(-90 35 35)"
                    style="transition:stroke-dashoffset 0.6s;filter:drop-shadow(0 0 5px #7b61ff)"/>
            <text id="gauge-ram-val" x="35" y="32" text-anchor="middle"
                  fill="#7b61ff" font-size="11" font-weight="700" font-family="'Share Tech Mono',monospace">0%</text>
            <text x="35" y="44" text-anchor="middle"
                  fill="#2e4a6a" font-size="6" font-family="'Share Tech Mono',monospace">RAM</text>
          </svg>
        </div>
        <div class="gauge-wrap">
          <svg viewBox="0 0 70 70" class="gauge-svg">
            <circle cx="35" cy="35" r="28" fill="none" stroke="#0d1e38" stroke-width="4"/>
            <circle id="arc-disk" cx="35" cy="35" r="28" fill="none" stroke="#00ffb3"
                    stroke-width="4" stroke-linecap="round"
                    stroke-dasharray="175.9 175.9" stroke-dashoffset="175.9"
                    transform="rotate(-90 35 35)"
                    style="transition:stroke-dashoffset 0.6s;filter:drop-shadow(0 0 5px #00ffb3)"/>
            <text id="gauge-disk-val" x="35" y="32" text-anchor="middle"
                  fill="#00ffb3" font-size="11" font-weight="700" font-family="'Share Tech Mono',monospace">0%</text>
            <text x="35" y="44" text-anchor="middle"
                  fill="#2e4a6a" font-size="6" font-family="'Share Tech Mono',monospace">DISK</text>
          </svg>
        </div>
      </div>
      <div class="net-grid">
        <div class="net-row"><span class="net-lbl">↑</span><span class="net-val" id="d-net-up">0 B/s</span></div>
        <div class="net-row"><span class="net-lbl">↓</span><span class="net-val" id="d-net-down">0 B/s</span></div>
      </div>
    </div>
  </div>

  <!-- NOTES widget -->
  <div class="widget" data-wid="notes">
    <div class="widget-bar">
      <span class="wi-dot"></span>
      <span class="wi-title">MEMO</span>
      <span class="wi-drag">⠿</span>
    </div>
    <div class="widget-body notes-body" id="d-notes">
      <div class="empty-msg">No notes</div>
    </div>
  </div>

</div>

<script src="/static/js/display.js"></script>
</body>
</html>
